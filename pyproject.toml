[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verireason"
version = "0.1.0"
description = "Reproducible small-model Text-to-SQL post-training research"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "sqlglot==30.17.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "ruff==0.12.8",
]
gpu = [
  "accelerate==1.14.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "bitsandbytes==0.49.2; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "datasets==4.7.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "peft==0.19.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "torch==2.11.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "transformers==5.14.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "trl==1.9.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "vllm==0.25.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.scripts]
verireason-envcheck = "verireason.envcheck:main"
verireason-smoke = "verireason.smoke:main"
verireason-demo = "verireason.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
