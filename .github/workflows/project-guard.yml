name: project-guard

on:
  push:
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
      - run: python -m pip install -r requirements/m10-cpu-lock.txt
      - run: python -m pip install --no-build-isolation --no-deps .
      - run: make m10-verify PYTHON=python PIP_CHECK_PYTHON=python

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag verireason:m10 .
      - run: docker run --rm verireason:m10
