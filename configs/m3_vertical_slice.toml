schema_version = 1
status = "day4a_hardened_precloud_contract"
experiment_id = "m3_vertical_slice_001"

[model]
model_id = "Qwen/Qwen3-4B-Base"
revision = "906bfd4b4dc7f14ee4320094d8b41684abff8539"
trust_remote_code = false
dtype = "bfloat16"

[data]
manifest_index_sha256 = "0e1182eb16bf5bed4b6d5505b11fcf6860689abe9f0435e3d2b3fc33bf7d1cda"
training_manifest_sha256 = "d90ffab32e296248376c542b736aef5ce7f547acc702a9eab41073789cf5b72a"
selector_version = "m3_tiny_selector_v1"
selector_seed = "verireason-m3-vertical-slice-v1"
required_features = ["join", "aggregate", "subquery"]
optional_features = ["group_by", "order_by", "set_operation"]
train_count = 8
validation_count = 8
heldout_examples_loaded = 0
heldout_examples_evaluated = 0

[prompt]
contract_version = "m3_sqlite_sql_only_v1"
schema_version = "m3_sqlite_schema_v1"
target_version = "m3_sql_target_v1"
system = "You translate questions into SQLite. Return exactly one read-only SELECT or WITH ... SELECT query. Return SQL only, with no explanation or Markdown."
include_sample_values = false
include_reasoning = false
enable_thinking = false
strip_target_trailing_semicolon = true
append_eos = true
max_sequence_tokens = 2048
max_answer_tokens = 384
schema_overflow_policy = "drop_complete_tables_from_end"

[decoding]
do_sample = false
num_beams = 1
max_new_tokens = 384

[qlora]
load_in_4bit = true
bnb_4bit_quant_type = "nf4"
bnb_4bit_use_double_quant = true
bnb_4bit_compute_dtype = "bfloat16"
lora_rank = 16
lora_alpha = 32
lora_dropout = 0.0
target_modules = ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
bias = "none"
task_type = "CAUSAL_LM"
learning_rate = 0.0002
per_device_train_batch_size = 1
gradient_accumulation_steps = 4
maximum_optimizer_steps = 2
gradient_checkpointing = true
maximum_gradient_norm = 1.0
seed = 23

[evaluator]
metrics = ["bird_ex_behavior_compatible", "strict_execution_accuracy"]
timeout_seconds = 10.0
maximum_cpu_seconds = 12
maximum_cpu_hard_seconds = 13
maximum_result_rows = 100000
maximum_result_bytes = 67108864
maximum_vm_bytes = 2147483648
maximum_float_pair_checks = 1000000
float_absolute_tolerance = 0.000001
float_relative_tolerance = 0.000001

[evidence]
require_clean_git = true
require_fresh_reload_process = true
require_optimizer_steps_at_least = 1
require_adapter_parameter_delta = true
require_same_validation_slice = true
require_same_prompt_hashes = true
maximum_session_wall_seconds = 14400
maximum_session_cost_cny = 10.36
planning_rate_cny_per_hour = 2.59
minimum_output_free_bytes = 21474836480
terminate_grace_seconds = 10
