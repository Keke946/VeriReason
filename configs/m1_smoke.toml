[[cases]]
id = "filter"
question = "List the names of active employees whose salary is at least 100000."
expected_rows_json = '[["Ada"]]'

[[cases]]
id = "join"
question = "Return each active employee name and department name, ordered by employee name."
expected_rows_json = '[["Ada", "Engineering"], ["Ben", "Engineering"], ["Di", "Sales"]]'

[[cases]]
id = "aggregate"
question = "For every department, return its name and the number of active employees, including departments with zero active employees, ordered by department name."
expected_rows_json = '[["Engineering", 2], ["Legal", 0], ["Sales", 1]]'

[[cases]]
id = "anti_join"
question = "Return the names of departments that have no employees, ordered by department name."
expected_rows_json = '[["Legal"]]'
